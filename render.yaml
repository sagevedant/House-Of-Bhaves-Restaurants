services:
  - type: web
    name: house-of-bhaves-restaurants
    env: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_PATH
        value: ./data/hob-restaurant.db
      - key: MOCK_WHATSAPP
        value: "false"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: MANAGER_PHONE
        sync: false
