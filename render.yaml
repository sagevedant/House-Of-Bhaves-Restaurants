services:
  - type: web
    name: house-of-bhaves-restaurants
    env: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_PATH
        value: ./data/spice-factory.db
      - key: MOCK_WHATSAPP
        value: "true"
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MAKE_WEBHOOK_URL
        sync: false
      - key: MANAGER_PHONE
        value: "919699533441"
    disk:
      name: sqlite-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
