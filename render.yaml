services:
  - type: web
    name: house-of-bhaves-restaurants
    env: node
    region: singapore
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_PATH
        value: ./data/hob-restaurant.db
      - key: MOCK_WHATSAPP
        value: "false"
      - key: WEBHOOK_VERIFY_TOKEN
        value: "hob_restaurant_secret"
      - key: MANAGER_PHONE
        value: "919699533441"
